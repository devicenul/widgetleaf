name: WidgetLeaf Release & Play Store CD

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APK/AAB & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.jks
          else
            keytool -genkeypair -v \
              -keystore app/keystore/release.jks \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -alias "${{ secrets.ANDROID_KEY_ALIAS || 'widgetleafKey' }}" \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'widgetleafRelease' }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'widgetleafRelease' }}" \
              -dname "CN=WidgetLeaf, OU=DevNullApps, O=DevNullApps, L=Mountain View, ST=CA, C=US"
          fi

      - name: Build Signed Release APK & App Bundle (R8 + v2/v3 Signing)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'widgetleafRelease' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'widgetleafKey' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'widgetleafRelease' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Release Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: WidgetLeaf-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
